name: Full-Spectrum Reality Gates & Adversarial CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  reality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tests repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies with strict lockfile
        run: npm ci

      - name: Run Full Real Cross-Repository Integration & Adversarial Suite
        run: npm test
